# Example Docker Compose file for Wheelhouse. Copy to docker-compose.yml,
# create .env from .env.example, and adjust the media paths.
services:
  wheelhouse:
    image: tristanwl/wheelhouse:0.2.0
    # Or build from source instead (then run `docker compose up -d --build`):
    # build: .
    container_name: wheelhouse
    restart: unless-stopped
    ports:
      # Published on this machine only, so nobody on the network can reach the
      # setup page (and claim the instance with a setup token read from the
      # logs) before you have created the administrator. To use it from other
      # machines, put a TLS reverse proxy in front (docs/operations.md) or
      # change this to "3050:3050" (all interfaces) or "192.168.1.10:3050:3050"
      # (one LAN address), deliberately, after setup.
      - "127.0.0.1:3050:3050"
    env_file:
      - .env
    # The container runs as UID/GID 1000 by default; any numeric user works. To
    # match the owner of your media and ./config instead (needed for Convert to
    # write files with the right ownership), set it here. ./config must be
    # writable by that user: create it yourself first (`mkdir config`, and chown
    # it to the user, and do not make it world-writable: the server refuses to
    # start from such a directory). If Docker creates it, it is owned by root and
    # the server cannot start. It holds the database, the master key and the
    # setup token: keep a copy of secret.key apart from your backups
    # (docs/operations.md).
    # user: "1000:1000"
    # Optional hardening: nothing is written outside /config, the media mounts
    # and /tmp (GPU driver caches).
    # read_only: true
    # cap_drop: [ALL]
    # security_opt:
    #   - no-new-privileges:true
    # tmpfs:
    #   - /tmp
    volumes:
      # Settings (codec preferences) live here so they survive rebuilds.
      - ./config:/config
      # Only needed for the Codecs "Convert" feature. Mount your media at
      # the SAME in-container paths Sonarr/Radarr use (they report file
      # paths through their APIs and Wheelhouse opens them directly).
      - /path/to/movies:/movies
      - /path/to/tv:/tv
    # Optional hardware encoding (Intel/AMD VAAPI). Uncomment, and add the
    # host's render group GID (`getent group render`) if the device isn't
    # accessible inside the container.
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "105"
