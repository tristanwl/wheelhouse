name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# Job names are what branch protection requires (`check` at least), so keep them
# stable: check, acceptance, server, web, docker. Every action is pinned by commit SHA.
jobs:
  # The repository tooling in the root package (the acceptance suite's code):
  # type check, formatting, audit, and the shell scripts.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm audit
      - name: shellcheck
        run: shellcheck acceptance/*.sh scripts/*.sh
      # Every action pinned by commit SHA, every image by digest (allowlist:
      # scripts/check-pins.allow).
      - name: pins
        run: scripts/check-pins.sh
      - name: documentation links, file references and the environment variable table
        run: python3 scripts/check-docs.py

  # Black-box HTTP suite (acceptance/README.md) against the real binary: the UI
  # is built and embedded first, as in the image. Runs alongside the other jobs.
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: |
            server/go.sum
            server/go.mod
      - run: npm ci
      - name: build the UI and the server
        run: |
          npm --prefix web ci
          npm --prefix web run build
          npm --prefix web run embed
          make -C server build
      - run: npm run test:acceptance

  # The Go server in server/.
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: |
            server/go.sum
            server/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: server
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # go.mod and go.sum tidy and verified; every module in the shipped binary
      # must carry one of these licenses (all compatible with GPL-3.0). Keep the
      # list in step with `deps` in server/Makefile.
      - name: dependencies
        run: |
          go mod tidy -diff
          go mod verify
          go run github.com/google/go-licenses/v2@v2.0.1 check ./cmd/wheelhouse --ignore github.com/tristanwl/wheelhouse --allowed_licenses=MIT,BSD-2-Clause,BSD-3-Clause,Apache-2.0,ISC
      - name: build
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o wheelhouse ./cmd/wheelhouse

  # The Vite UI in web/: its own checks, then the build embedded in the Go binary
  # and driven in a real browser.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: |
            server/go.sum
            server/go.mod
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm audit
      - run: npm run build
      - name: embed the build and test the Go side with it
        run: |
          npm run embed
          cd ../server
          go vet ./...
          go test ./internal/ui ./internal/app ./internal/middleware
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o wheelhouse ./cmd/wheelhouse
      - run: npx playwright-core install --with-deps chromium
      - name: browser smoke test
        run: npm run test:smoke
        env:
          WHEELHOUSE_SMOKE_REQUIRED: "1"

  # The image, built as the release builds it (but not pushed), then run the way
  # it is deployed: read-only, no capabilities, arbitrary user, and driven by the
  # acceptance suite. The release publishes linux/amd64 and linux/arm64, so both
  # are built here; the amd64 image gets the full treatment and the arm64 image
  # (run under QEMU, so slower) must start, report its version, have ffmpeg and
  # pass the container smoke test.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # Emulation only for running the arm64 image (the Dockerfile's builder
      # stages run natively and cross-compile); the binfmt image is pinned by
      # tag and digest, bump it by hand (Dependabot cannot see it here).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: wheelhouse:ci
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: wheelhouse:ci-arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
      - name: the image carries the version from package.json
        run: |
          want="wheelhouse $(node -p "require('./package.json').version")"
          got="$(docker run --rm wheelhouse:ci version)"
          [ "$got" = "$want" ] || { echo "::error::image says '$got', package.json says '$want'"; exit 1; }
      - name: container smoke test
        run: acceptance/docker-smoke.sh wheelhouse:ci
      - run: npm ci
      - name: acceptance suite against the container
        run: npm run test:acceptance
        env:
          WHEELHOUSE_CMD: acceptance/docker-server.sh wheelhouse:ci
      - name: the arm64 image runs (under QEMU)
        run: |
          arch="$(docker image inspect --format '{{.Architecture}}' wheelhouse:ci-arm64)"
          [ "$arch" = arm64 ] || { echo "::error::wheelhouse:ci-arm64 is $arch"; exit 1; }
          want="wheelhouse $(node -p "require('./package.json').version")"
          got="$(docker run --rm --platform linux/arm64 wheelhouse:ci-arm64 version)"
          [ "$got" = "$want" ] || { echo "::error::arm64 image says '$got', package.json says '$want'"; exit 1; }
          docker run --rm --platform linux/arm64 --entrypoint ffmpeg wheelhouse:ci-arm64 -hide_banner -version | head -n 1
          docker run --rm --platform linux/arm64 --entrypoint ffprobe wheelhouse:ci-arm64 -hide_banner -version | head -n 1
      - name: container smoke test (arm64)
        run: acceptance/docker-smoke.sh wheelhouse:ci-arm64
        env:
          SMOKE_HEALTH_ATTEMPTS: "240" # QEMU is slow to start
      - name: remove leftover containers
        if: always()
        run: docker ps -aq --filter name=wheelhouse-acceptance | xargs -r docker rm -f
