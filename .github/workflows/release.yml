name: Release

# Pushing a tag like 0.0.1 runs the full CI checks, then builds the multi-arch
# image (linux/amd64 and linux/arm64), pushes it to Docker Hub, and creates a
# GitHub release with generated notes.
#
# One-time setup (repo settings -> Secrets and variables -> Actions):
#   secret   DOCKERHUB_PAT        Docker Hub access token with read/write
#   variable DOCKERHUB_USERNAME   Docker Hub user or org that owns the image

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    env:
      IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/wheelhouse
    steps:
      - name: Check Docker Hub configuration
        env:
          USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          PAT: ${{ secrets.DOCKERHUB_PAT }}
        run: |
          [ -n "$USERNAME" ] || { echo "::error::Set the DOCKERHUB_USERNAME repository variable"; exit 1; }
          [ -n "$PAT" ] || { echo "::error::Set the DOCKERHUB_PAT repository secret"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag is on main and matches package.json
        run: |
          git branch -r --contains "$GITHUB_SHA" | grep -qE '^\s*origin/main$' \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          version="$(node -p "require('./package.json').version")"
          [ "$version" = "$GITHUB_REF_NAME" ] \
            || { echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($version)"; exit 1; }

      # Emulation is needed only for the apk layer of the arm64 image: the UI and
      # the Go binary are built natively on the runner (the Dockerfile's first two
      # stages run on $BUILDPLATFORM and cross-compile). The binfmt image is
      # pinned by tag and digest like the actions; Dependabot cannot see it here,
      # so bump it by hand when a newer qemu-v* tag is at least two weeks old.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # No `latest` tag until authentication ships: an unauthenticated
          # app should not be what `docker pull wheelhouse` gets by default.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !startsWith(github.ref_name, '0.0.') }}

      # One tag, one multi-arch manifest: linux/amd64 and linux/arm64 (issue #14).
      # The Dockerfile cross-compiles the Go server natively and installs the
      # Intel VAAPI drivers on x86 only. The version stamped into the binary is
      # read from package.json, which the check above ties to the tag.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the pushed tag is a multi-arch manifest
        run: |
          version="$GITHUB_REF_NAME"
          out="$(docker buildx imagetools inspect "$IMAGE:$version")"
          echo "$out"
          for platform in linux/amd64 linux/arm64; do
            grep -qE "^ +Platform: +$platform\$" <<< "$out" \
              || { echo "::error::$IMAGE:$version has no $platform image"; exit 1; }
          done

      # Works whether the release is created here (tag pushed from a terminal)
      # or by hand in the GitHub UI first (which also creates the tag): an
      # existing release keeps its title and generated notes and gets the image
      # line and the right pre-release flag added.
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$GITHUB_REF_NAME"
          prerelease=false
          case "$version" in 0.* | *-*) prerelease=true ;; esac

          extra="Docker image: \`docker pull $IMAGE:$version\`"
          if [ "$prerelease" = true ]; then
            # Versions up to 0.2.x (the last released) have no authentication; later pre-releases do.
            case "$version" in
              0.0.* | 0.1.* | 0.2.*)
                extra="$extra"$'\n\n'"**Alpha.** This version has no authentication. Run it only on a trusted network."
                ;;
              *)
                extra="$extra"$'\n\n'"**Pre-release.** This version has accounts and sign-in, but the project is still a pre-release: do not expose it to the internet."
                ;;
            esac
          fi

          if gh release view "$version" > /dev/null 2>&1; then
            body="$(gh release view "$version" --json body --jq .body)"
            if ! grep -qF "docker pull $IMAGE:$version" <<< "$body"; then
              printf '%s\n\n%s\n' "$extra" "$body" > "$RUNNER_TEMP/notes.md"
              gh release edit "$version" --notes-file "$RUNNER_TEMP/notes.md"
            fi
            gh release edit "$version" --prerelease="$prerelease"
          else
            flags=()
            [ "$prerelease" = true ] && flags+=(--prerelease)
            gh release create "$version" \
              --verify-tag --generate-notes \
              --title "Wheelhouse $version" \
              --notes "$extra" \
              "${flags[@]}"
          fi
