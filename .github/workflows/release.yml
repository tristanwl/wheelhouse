name: Release

# Pushing a tag like 0.0.1 runs the full CI checks, then builds the multi-arch
# image (linux/amd64 and linux/arm64), pushes it to Docker Hub with an SBOM and
# SLSA provenance (BuildKit attestations), signs the provenance of the image
# digest (GitHub artifact attestation, keyless through Sigstore, also pushed to
# Docker Hub) and creates a GitHub release with generated notes. How users
# verify all this: docs/verifying-releases.md.
#
# A manual run (workflow_dispatch) is always a dry run: the same build with SBOM
# and provenance enabled, written to a local OCI archive and inspected, with no
# login, push, attestation or release. Use it to test changes to this workflow:
#   gh workflow run Release --ref <branch> -f dry_run=true
#
# One-time setup, see docs/maintainer-settings.md:
#   environment release           only runs for tags [0-9]*; holds the secret below
#   secret   DOCKERHUB_PAT        in the release environment: Docker Hub access token, read/write
#   variable DOCKERHUB_USERNAME   Docker Hub user or org that owns the image

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build with SBOM and provenance but do not push, sign or release (manual runs are always dry runs)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # The Docker Hub token lives in the `release` environment, which only accepts
    # tag runs. A dry run uses a separate environment that holds no secret.
    environment: ${{ github.event_name == 'push' && 'release' || 'release-dry-run' }}
    permissions:
      contents: write # create the GitHub release
      id-token: write # sign the provenance attestation (Sigstore, keyless)
      attestations: write # store the attestation
    env:
      IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/wheelhouse
      # Anything but a tag push is a dry run: nothing is pushed or published.
      DRY_RUN: ${{ github.event_name != 'push' }}
    steps:
      - name: Manual runs are dry runs
        if: github.event_name != 'push' && inputs.dry_run != true
        run: |
          echo "::error::Manual runs are always dry runs; to publish, push a release tag"
          exit 1

      - name: Check Docker Hub configuration
        if: env.DRY_RUN != 'true'
        env:
          USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          PAT: ${{ secrets.DOCKERHUB_PAT }}
        run: |
          [ -n "$USERNAME" ] || { echo "::error::Set the DOCKERHUB_USERNAME repository variable"; exit 1; }
          [ -n "$PAT" ] || { echo "::error::Set the DOCKERHUB_PAT secret in the release environment"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag is on main and matches package.json
        if: env.DRY_RUN != 'true'
        run: |
          git branch -r --contains "$GITHUB_SHA" | grep -qE '^\s*origin/main$' \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          version="$(node -p "require('./package.json').version")"
          [ "$version" = "$GITHUB_REF_NAME" ] \
            || { echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($version)"; exit 1; }

      # Emulation is needed only for the apk layer of the arm64 image: the UI and
      # the Go binary are built natively on the runner (the Dockerfile's first two
      # stages run on $BUILDPLATFORM and cross-compile). The binfmt image is
      # pinned by tag and digest like the actions; Dependabot cannot see it here,
      # so bump it by hand when a newer qemu-v* tag is at least two weeks old.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: env.DRY_RUN != 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # No `latest` tag until authentication ships: an unauthenticated
          # app should not be what `docker pull wheelhouse` gets by default.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !startsWith(github.ref_name, '0.0.') }}

      # One tag, one multi-arch manifest: linux/amd64 and linux/arm64 (issue #14).
      # The Dockerfile cross-compiles the Go server natively and installs the
      # Intel VAAPI drivers on x86 only. The version stamped into the binary is
      # read from package.json, which the check above ties to the tag.
      #
      # sbom and provenance make BuildKit attach an SPDX SBOM and SLSA provenance
      # (mode=max: the build steps and base image digests) to the image index as
      # attestation manifests. No build arguments or secrets are passed to the
      # build, because mode=max would record them.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.DRY_RUN != 'true' }}
          # A dry run writes an OCI archive instead of pushing.
          outputs: ${{ env.DRY_RUN == 'true' && format('type=oci,dest={0}/dry-run.tar', runner.temp) || '' }}
          sbom: true
          provenance: mode=max
          tags: ${{ env.DRY_RUN == 'true' && 'wheelhouse:dry-run' || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Dry run, check the image archive carries SBOM and provenance
        if: env.DRY_RUN == 'true'
        run: |
          mkdir "$RUNNER_TEMP/oci"
          tar -xf "$RUNNER_TEMP/dry-run.tar" -C "$RUNNER_TEMP/oci"
          cd "$RUNNER_TEMP/oci/blobs/sha256" || exit 1
          count() { grep -rlaE "$1" . | wc -l; }
          # One attestation manifest per platform, each with an SBOM and provenance.
          n="$(count '"vnd.docker.reference.type": ?"attestation-manifest"')"
          [ "$n" = 2 ] || { echo "::error::expected 2 attestation manifests, found $n"; exit 1; }
          n="$(count '"in-toto.io/predicate-type": ?"https://spdx.dev/Document"')"
          [ "$n" -ge 2 ] || { echo "::error::SBOM attestations missing ($n)"; exit 1; }
          n="$(count '"in-toto.io/predicate-type": ?"https://slsa.dev/provenance/v1"')"
          [ "$n" -ge 2 ] || { echo "::error::provenance attestations missing ($n)"; exit 1; }
          # Build-machine paths in the documents are worth a look, not a failure.
          if grep -rlaE '/home/runner|/opt/hostedtoolcache' . ; then
            echo "::warning::the archive mentions runner paths; check the attestation layers"
          fi
          echo "Dry run ok: SBOM and provenance attached for both platforms; nothing was pushed."

      - name: Check the pushed tag is a multi-arch manifest with attestations
        if: env.DRY_RUN != 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          version="$GITHUB_REF_NAME"
          out="$(docker buildx imagetools inspect "$IMAGE:$version")"
          echo "$out"
          for platform in linux/amd64 linux/arm64; do
            grep -qE "^ +Platform: +$platform\$" <<< "$out" \
              || { echo "::error::$IMAGE:$version has no $platform image"; exit 1; }
          done
          # The tag must point at the digest that was just built (and attested).
          pushed="$(awk '/^Digest:/ { print $2; exit }' <<< "$out")"
          [ -n "$DIGEST" ] && [ "$pushed" = "$DIGEST" ] \
            || { echo "::error::$IMAGE:$version is $pushed, the build produced $DIGEST"; exit 1; }
          # One SBOM + provenance attestation manifest per platform.
          n="$(grep -cE 'vnd.docker.reference.type: +attestation-manifest' <<< "$out" || true)"
          [ "$n" = 2 ] || { echo "::error::expected 2 attestation manifests in $IMAGE:$version, found $n"; exit 1; }
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{ json .SBOM }}' | grep -q SPDXID \
            || { echo "::error::no SPDX SBOM in $IMAGE@$DIGEST"; exit 1; }
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{ json .Provenance }}' > "$RUNNER_TEMP/provenance.json"
          grep -q '"buildType"' "$RUNNER_TEMP/provenance.json" \
            || { echo "::error::no SLSA provenance in $IMAGE@$DIGEST"; exit 1; }
          grep -qE "\"vcs:revision\": *\"$GITHUB_SHA\"" "$RUNNER_TEMP/provenance.json" \
            || echo "::warning::the BuildKit provenance does not record commit $GITHUB_SHA"

      # Signed build provenance for the image index digest, which covers the
      # per-platform images and the SBOM and provenance attached to the index.
      # The statement is stored with GitHub and pushed to Docker Hub next to the
      # image (the registry name is docker.io, with no tag). Storage records need
      # an organization-owned repository, so they are off.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.DRY_RUN != 'true'
        with:
          subject-name: docker.io/${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      # The same command users are told to run (docs/verifying-releases.md), by
      # digest. Retried briefly: a new attestation can take a moment to be listed.
      - name: Verify the attestation like a user would
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh attestation verify "oci://docker.io/$IMAGE@$DIGEST" \
                 --repo "$GITHUB_REPOSITORY" \
                 --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                 --source-ref "$GITHUB_REF"; then
              exit 0
            fi
            echo "attempt $attempt failed; retrying"
            sleep 15
          done
          echo "::error::the attestation for $IMAGE@$DIGEST did not verify"
          exit 1

      # Works whether the release is created here (tag pushed from a terminal)
      # or by hand in the GitHub UI first (which also creates the tag): an
      # existing release keeps its title and generated notes and gets the image
      # line and the right pre-release flag added.
      - name: Create or update GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$GITHUB_REF_NAME"
          prerelease=false
          case "$version" in 0.* | *-*) prerelease=true ;; esac

          extra="Docker image: \`docker pull $IMAGE:$version\`"$'\n\n'"Verify the image digest, signed provenance and SBOM: [docs/verifying-releases.md](https://github.com/$GITHUB_REPOSITORY/blob/$version/docs/verifying-releases.md)"
          if [ "$prerelease" = true ]; then
            # Versions up to 0.2.x (the last released) have no authentication; later pre-releases do.
            case "$version" in
              0.0.* | 0.1.* | 0.2.*)
                extra="$extra"$'\n\n'"**Alpha.** This version has no authentication. Run it only on a trusted network."
                ;;
              *)
                extra="$extra"$'\n\n'"**Pre-release.** This version has accounts and sign-in, but the project is still a pre-release: do not expose it to the internet."
                ;;
            esac
          fi

          if gh release view "$version" > /dev/null 2>&1; then
            body="$(gh release view "$version" --json body --jq .body)"
            if ! grep -qF "docker pull $IMAGE:$version" <<< "$body"; then
              printf '%s\n\n%s\n' "$extra" "$body" > "$RUNNER_TEMP/notes.md"
              gh release edit "$version" --notes-file "$RUNNER_TEMP/notes.md"
            fi
            gh release edit "$version" --prerelease="$prerelease"
          else
            flags=()
            [ "$prerelease" = true ] && flags+=(--prerelease)
            gh release create "$version" \
              --verify-tag --generate-notes \
              --title "Wheelhouse $version" \
              --notes "$extra" \
              "${flags[@]}"
          fi
