version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - unconvert
  exclusions:
    rules:
      # Tests build requests against handlers or a local listener; a context adds
      # nothing, and bodyclose cannot see through the small helpers.
      - path: _test\.go
        linters:
          - noctx
          - bodyclose
      # Tests plant obviously fake canary secrets on purpose.
      - path: _test\.go
        linters:
          - gosec
        text: G101
      # The table of environment variable names (SONARR_API_KEY, ...) is not a credential.
      - path: internal/providers/core/envsource\.go
        linters:
          - gosec
        text: G101
