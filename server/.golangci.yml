version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - unconvert
  settings:
    misspell:
      # The API's confirmation code ("hardlinked") is not a misspelling.
      ignore-rules:
        - hardlinked
  exclusions:
    rules:
      # Tests build requests against handlers or a local listener; a context adds
      # nothing, and bodyclose cannot see through the small helpers.
      - path: _test\.go
        linters:
          - noctx
          - bodyclose
      # Tests plant obviously fake canary secrets on purpose.
      - path: _test\.go
        linters:
          - gosec
        text: G101
      # The table of environment variable names (SONARR_API_KEY, ...) is not a credential.
      - path: internal/providers/core/envsource\.go
        linters:
          - gosec
        text: G101
      # Test fixtures: fake tools are executable scripts in temp dirs, and the
      # tests run the tools they just wrote.
      - path: _test\.go
        linters:
          - gosec
        text: G(115|204|301|302|304|306)
