version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - unconvert
  exclusions:
    rules:
      # Tests build requests against handlers or a local listener; a context adds
      # nothing, and bodyclose cannot see through the small helpers.
      - path: _test\.go
        linters:
          - noctx
          - bodyclose
